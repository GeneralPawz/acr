[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
acr-formats = { path = "crates/acr-formats" }
acr-mapgen = { path = "crates/acr-mapgen" }
acr-script = { path = "crates/acr-script" }
acr-sim = { path = "crates/acr-sim" }
acr-mission = { path = "crates/acr-mission" }
acr-render = { path = "crates/acr-render" }
acr-audio = { path = "crates/acr-audio" }
acr-app = { path = "crates/acr-app" }
acr-video = { path = "crates/acr-video" }
acr-physics = { path = "crates/acr-physics" }

# Line tables keep backtraces readable at a fraction of the size of full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

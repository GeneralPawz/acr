[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
acr-formats = { path = "crates/acr-formats" }
acr-mapgen = { path = "crates/acr-mapgen" }
acr-script = { path = "crates/acr-script" }
acr-sim = { path = "crates/acr-sim" }
acr-mission = { path = "crates/acr-mission" }
acr-render = { path = "crates/acr-render" }
acr-audio = { path = "crates/acr-audio" }
acr-app = { path = "crates/acr-app" }
acr-video = { path = "crates/acr-video" }
acr-physics = { path = "crates/acr-physics" }
acr-ui-protocol = { path = "crates/acr-ui-protocol" }

# Line tables keep backtraces readable at a fraction of the size of full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Android mouse (#331): winit 0.30 turns every Android MotionEvent into a Touch and drops hover,
# buttons and the wheel. This fork reports a mouse pointer as CursorMoved/MouseInput/MouseWheel;
# upstream has no such support (master skips mouse pointers, rust-windowing/winit
# src android event_loop.rs). Branch acr/android-mouse on v0.30.13.
[patch.crates-io]
winit = { git = "https://github.com/GeneralPawz/winit", rev = "9d6694d45a3d23699d6e10efab58bbf10abf424a" }

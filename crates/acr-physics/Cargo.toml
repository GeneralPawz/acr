[package]
name = "acr-physics"
description = "XPBD active ragdolls for the body simulation of American Conquest (render side, native and wasm)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

# wasm32 bench: a cdylib driven by examples/bench_wasm.mjs (node).
[[example]]
name = "bench_wasm"
crate-type = ["cdylib"]

# Islands of awake ragdolls step in parallel on native; wasm is single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12"

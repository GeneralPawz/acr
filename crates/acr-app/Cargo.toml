[package]
name = "acr-app"
description = "Platform layer shared by the ACR apps: GPU setup and asset loading, native and in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
acr-formats.workspace = true
log = "0.4.34"
wgpu = "30.0.1"
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["File", "Blob", "Window", "Document", "Location", "Request", "RequestInit", "Headers", "Response", "Storage"] }

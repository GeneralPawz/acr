[package]
name = "acr-audio"
description = "Sound effects and music for American Conquest: WAV/Vorbis decoding, mixing, output"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["output"]
# Audio device output via cpal; without it the crate only decodes and mixes.
output = ["dep:cpal"]

[dependencies]
cpal = { version = "0.18.2", optional = true }
lewton = "0.10.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.18.2", optional = true, features = ["wasm-bindgen"] }

[package]
name = "acr-game"
description = "American Conquest, rebuilt: the game executable (native and browser)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "AmericanConquest"
path = "src/main.rs"

[dependencies]
acr-app.workspace = true
acr-audio.workspace = true
acr-formats.workspace = true
acr-render.workspace = true
acr-sim.workspace = true
acr-video.workspace = true
log = "0.4.34"
web-time = "1.1.0"
wgpu = "30.0.1"
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"
rfd = "0.17.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "HtmlLinkElement", "Element", "Url", "Blob", "BlobPropertyBag"] }

[build-dependencies]
winresource = "0.1.34"

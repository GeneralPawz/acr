[package]
name = "acr-game"
description = "American Conquest, rebuilt: the game executable (native and browser)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "AmericanConquest"
path = "src/main.rs"

# The Android WebView spike (docs/webui.md, "Android spike"; tools/android/build-webview-spike.sh).
# Empty on every other target.
[[example]]
name = "webview_spike_android"
crate-type = ["cdylib"]

[dependencies]
acr-app.workspace = true
acr-audio.workspace = true
acr-formats.workspace = true
acr-mapgen.workspace = true
acr-render.workspace = true
acr-sim.workspace = true
acr-mission.workspace = true
acr-physics.workspace = true
acr-ui-protocol.workspace = true
acr-video.workspace = true
log = "0.4.34"
png = "0.18.1"
serde_json = "1.0.154"
web-time = "1.1.0"
wgpu = "30.0.1"
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
rfd = "0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.22.4"
winit = { version = "0.30", features = ["android-native-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "HtmlLinkElement", "Element", "Url", "Blob", "BlobPropertyBag", "HtmlCanvasElement", "EventTarget", "Event", "MouseEvent", "AddEventListenerOptions", "console"] }

[build-dependencies]
winresource = "0.1.34"

[package]
name = "acr-render"
description = "GPU renderer for American Conquest sprites and maps (native and WebGPU/WebGL2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
acr-formats.workspace = true
log = "0.4.34"
bytemuck = { version = "1.25.2", features = ["derive"] }
wgpu = { version = "30.0.1", features = ["webgl"] }
# glTF models (#163): parsing only, no file or image loading (works in wasm).
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"] }
png = "0.18.1"
# JPEG base colours in glTF files (#199): pure Rust, builds for wasm.
zune-jpeg = "0.5"
serde_json = "1.0.154"
# Level-of-detail simplification (pure Rust port of meshoptimizer, MIT; builds for wasm).
meshopt-rs = { version = "0.1.2", features = ["experimental"] }

# Per-instance loops of the 3D frame run in parallel on native (`par.rs`); wasm is single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12"

# The browser decodes streamed pictures off the main thread (`createImageBitmap`, tex_cache.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Blob", "ImageBitmap", "ImageBitmapOptions", "PremultiplyAlpha", "ColorSpaceConversion"] }

[dev-dependencies]
jpeg-encoder = "0.6"
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out"] }

[package]
name = "acr-render"
description = "GPU renderer for American Conquest sprites and maps (native and WebGPU/WebGL2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
acr-formats.workspace = true
log = "0.4.34"
bytemuck = { version = "1.25.2", features = ["derive"] }
wgpu = { version = "30.0.1", features = ["webgl"] }
# glTF models (#163): parsing only, no file or image loading (works in wasm).
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"] }
png = "0.18.1"
# JPEG base colours in glTF files (#199): pure Rust, builds for wasm.
zune-jpeg = "0.5"
serde_json = "1.0.154"
# Level-of-detail simplification (pure Rust port of meshoptimizer, MIT; builds for wasm).
meshopt-rs = { version = "0.1.2", features = ["experimental"] }

[dev-dependencies]
jpeg-encoder = "0.6"
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out"] }

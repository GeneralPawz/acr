# Regenerates the status table in README.md from the issues labelled `tracking`
# whenever an issue changes, so the table follows the issue tracker.
name: README status

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled, milestoned, demilestoned]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: readme-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render status table
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: 'tracking', state: 'all', per_page: 100,
            });
            issues.sort((a, b) => a.number - b.number);
            const rows = issues.map((i) => {
              const s = i.sub_issues_summary || { total: 0, completed: 0 };
              const state = i.state === 'closed' ? 'done' : s.completed > 0 ? 'in progress' : 'open';
              const milestone = i.milestone ? i.milestone.title.split(' ')[0] : '';
              return `| [${i.title}](${i.html_url}) | ${milestone} | ${s.completed}/${s.total} | ${state} |`;
            });
            const table = ['| Area | Milestone | Done | State |', '|---|---|---:|---|', ...rows].join('\n');
            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!-- status:start -->[\s\S]*<!-- status:end -->/,
              `<!-- status:start -->\n${table}\n<!-- status:end -->`,
            );
            fs.writeFileSync('README.md', updated);
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update README status table"
          git push

# Builds the game for Windows (x64, ARM64) and the browser on a version tag and
# attaches the results to a GitHub release. Release binaries carry a stand-in icon;
# `cargo xtask dist --game-dir <dir>` builds a local copy with the original icon.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin AmericanConquest
      - run: Compress-Archive -Path target/${{ matrix.target }}/release/AmericanConquest.exe -DestinationPath AmericanConquest-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: AmericanConquest-windows-${{ matrix.arch }}.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask web --release --app game
      - run: cd target/web/game && zip -r ../../../AmericanConquest-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: AmericanConquest-web.zip

  publish:
    needs: [windows, web]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes
          AmericanConquest-windows-x64.zip AmericanConquest-windows-arm64.zip AmericanConquest-web.zip

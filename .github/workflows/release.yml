# Builds the game for Windows (x64, ARM64) and the browser on a version tag and
# attaches the results to a GitHub release. Each Windows zip holds the game
# (AmericanConquest.exe), the browser version (web\) and its launcher
# (AmericanConquest-Web.exe). Both carry the original game icon
# (crates/acr-game/Ac.ico).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    name: svelte ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - run: bun install --frozen-lockfile
        working-directory: ui
      - run: bun run check && bun run test && bun run build
        working-directory: ui
      - uses: actions/upload-artifact@v4
        with:
          name: acr-ui
          path: ui/dist
          if-no-files-found: error

  web:
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acr-ui
          path: ui-dist
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask web --release --app game
        env:
          ACR_UI_DIST: ${{ github.workspace }}/ui-dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: target/web/game
      - run: cd target/web/game && zip -r ../../../AmericanConquest-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: AmericanConquest-web.zip

  windows:
    name: windows ${{ matrix.arch }}
    needs: [web, ui]
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acr-ui
          path: ui-dist
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin AmericanConquest --bin AmericanConquest-Web
        env:
          ACR_UI_DIST: ${{ github.workspace }}/ui-dist
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: package/web
      - run: |
          Copy-Item target/${{ matrix.target }}/release/AmericanConquest.exe package/
          Copy-Item target/${{ matrix.target }}/release/AmericanConquest-Web.exe package/
          Compress-Archive -Path package/* -DestinationPath AmericanConquest-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: AmericanConquest-windows-${{ matrix.arch }}.zip

  publish:
    needs: [windows, web]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows-*,web}"
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}"
          --notes-file docs/release-notes.md
          AmericanConquest-windows-x64.zip AmericanConquest-windows-arm64.zip AmericanConquest-web.zip
